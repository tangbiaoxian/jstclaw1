<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>表格</title>
  <style>
    body { font-family: "Microsoft YaHei", "SimSun", sans-serif; margin: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; margin: 0 auto; }
    th, td { border: 1px solid #333; padding: 8px 12px; text-align: center; font-size: 14px; }
    th { background-color: #e8e8e8; font-weight: bold; }
  </style>
</head>
<body>
  <table>
    <tr>
      <th rowspan="2">部门</th>
      <th rowspan="2">员工<br>ID</th>
      <th rowspan="2">姓名</th>
      <th colspan="3">2023 年绩效</th>
      <th colspan="2">薪资调整</th>
    </tr>
    <tr>
      <th>Q1</th>
      <th>Q2</th>
      <th>Q3</th>
      <th>幅度</th>
      <th>生效日</th>
    </tr>
    <tr>
      <td rowspan="3">技术<br>部</td>
      <td>E1001</td>
      <td>张三</td>
      <td>A</td>
      <td>A-</td>
      <td>B+</td>
      <td rowspan="2">8%</td>
      <td rowspan="2">2024/1/1</td>
    </tr>
    <tr>
      <td>E1002</td>
      <td>李四</td>
      <td>B+</td>
      <td>A</td>
      <td>A</td>
    </tr>
    <tr>
      <td>E1003</td>
      <td>王五</td>
      <td colspan="2">未评估</td>
      <td>A-</td>
      <td>5%</td>
      <td>2024/3/15</td>
    </tr>
    <tr>
      <td rowspan="2">市场<br>部</td>
      <td>E2001</td>
      <td>赵六</td>
      <td>A</td>
      <td>A</td>
      <td>A</td>
      <td>12%</td>
      <td>2024/1/1</td>
    </tr>
    <tr>
      <td>E2002</td>
      <td>钱七</td>
      <td>B</td>
      <td>B+</td>
      <td>A-</td>
      <td>6%</td>
      <td>2024/2/20</td>
    </tr>
    <tr>
      <td colspan="3">部门最高绩效</td>
      <td>A</td>
      <td>A</td>
      <td>A</td>
      <td colspan="2">技术部/市场部</td>
    </tr>
  </table>
</body>
</html>
